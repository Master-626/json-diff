[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-diff"
version = "0.2.1"
description = "Compare saved API responses with scoped ignores, exact decimals, JSON output and offline HTML reports."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["json", "diff", "compare", "cli", "ci-cd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
json-diff = "json_diff.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/json-diff"
Repository = "https://github.com/Master-626/json-diff"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["json_diff"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
