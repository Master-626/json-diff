name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.8 binaries are available on 22.04, not newer runner images.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ['3.8', '3.10', '3.12', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=json_diff --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - name: Smoke test installed wheel
        run: python scripts/smoke_wheel.py
