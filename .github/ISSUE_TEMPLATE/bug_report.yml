name: Bug report
description: Report a reproducible JSON comparison or CLI problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Use small, synthetic JSON examples. Do not include tokens, credentials or personal data.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, install method and commit/version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command and both JSON inputs, with private data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: Include stdout, stderr and exit codes where relevant.
    validations:
      required: true
